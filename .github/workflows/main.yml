name: Main Workflow
on:
  push:
  schedule:
    - cron: "0 0 * * 0"
jobs:
  build:
    name: Build
    timeout-minutes: 10
    strategy:
      matrix:
        python-version: [
          "3.10",
          "3.11",
          "3.12",
          "3.13",
          "3.14"
        ]
    runs-on: ubuntu-latest
    container:
      image: python:${{ matrix.python-version }}
    steps:
      - name: Checkout code from repository
        uses: actions/checkout@v7

      - name: Print Python version
        run: python --version

      - name: Install runtime dependencies
        run: pip install -r requirements.txt

      - name: Check code formatting with black
        if: matrix.python-version == '3.14'
        run: |
          pip install black
          black . --check

      - name: Run unit tests
        run: PYTHONPATH=src python -m unittest discover -s src -p "test_*.py"

      - name: Compile-check all Python sources
        run: python -m compileall -q .
